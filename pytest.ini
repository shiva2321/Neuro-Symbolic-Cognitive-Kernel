[pytest]
addopts = -ra
pythonpath =
    nsck

# Explicitly ignore binary/log artifacts that can trip collection.
collect_ignore =
    nsck/python/test_output.txt

testpaths =
    nsck/tests
    nsck/python
    nsck_ai_model/tests
    nsck_vision/tests

python_files =
    test_*.py
    *_test.py

# Avoid collecting stray non-test files (e.g. .txt) under python/
# and skip common build/cache dirs.
python_classes =
    Test*
python_functions =
    test_*

norecursedirs =
    **/__pycache__
    **/*.egg-info
    **/target

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
