[pytest]
addopts = -ra
pythonpath =
    nsck-demo

# Explicitly ignore binary/log artifacts that can trip collection.
collect_ignore =
    nsck-demo/python/test_output.txt

testpaths =
    nsck-demo/tests
    nsck-demo/python

python_files =
    test_*.py
    *_test.py

# Avoid collecting stray non-test files (e.g. .txt) under python/
# and skip common build/cache dirs.
python_classes =
    Test*
python_functions =
    test_*

norecursedirs =
    **/__pycache__
    **/*.egg-info
    **/target
