[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nsck-demo"
version = "0.5.0"
description = "Neuro-Symbolic Cognitive Kernel (NSCK) V5: glass-box cognitive architecture combining VSA, SNN, GWT, and Societal Hypervector Knowledge Representation"
requires-python = ">=3.11"
license = {text = "MIT"}
readme = "README.md"
authors = [
    {name = "shiva2321", email = "shiva2321@users.noreply.github.com"},
]
keywords = [
    "neuro-symbolic",
    "cognitive-architecture",
    "hyperdimensional-computing",
    "vsa",
    "spiking-neural-network",
    "global-workspace-theory",
    "societal-knowledge",
    "transparent-ai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Cognitive Science",
]

dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "pydantic>=2.0.0",
    "rustworkx>=0.14.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
snn = ["snntorch>=0.9.0"]
test = ["pytest>=7.0.0", "pytest-benchmark>=4.0.0"]
viz = ["flask>=2.3.0", "flask-socketio>=5.3.0"]
# Optional: heavy pre-trained model support (for transplant tests)
pretrained = ["transformers>=4.30.0"]

[project.urls]
Homepage = "https://github.com/shiva2321/Neuro-Symbolic-Cognitive-Kernel"
Source = "https://github.com/shiva2321/Neuro-Symbolic-Cognitive-Kernel"
Issues = "https://github.com/shiva2321/Neuro-Symbolic-Cognitive-Kernel/issues"
Changelog = "https://github.com/shiva2321/Neuro-Symbolic-Cognitive-Kernel/blob/main/nsck/docs/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["python"]

[tool.hatch.build.targets.sdist]
include = ["python/", "README.md", "LICENSE"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
