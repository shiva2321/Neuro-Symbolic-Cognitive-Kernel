[project]
name = "nsck-demo"
version = "0.2.0"
description = "Neural-Symbolic Cognitive Kernel: VSA + GWT cognitive architecture"
requires-python = ">=3.11"
license = {text = "MIT"}
readme = "README.md"

dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "pydantic>=2.0.0",
    "rustworkx>=0.14.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
snn = ["snntorch>=0.9.0"]
test = ["pytest>=7.0.0", "pytest-benchmark>=4.0.0"]
viz = ["flask>=2.3.0", "flask-socketio>=5.3.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
