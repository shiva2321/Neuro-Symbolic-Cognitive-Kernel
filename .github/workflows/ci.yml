# NSCK Comprehensive CI Pipeline
# Validates all projects with performance benchmarks and security scanning
name: NSCK CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  test-core:
    name: Test NSCK Core (V4)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "maturin>=1.4"

      - name: Build hypervec_rs (VSA Rust backend)
        run: |
          cd nsck/rust_vsa
          maturin develop --release
          cd ../..

      - name: Build snn_rs (SNN Rust backend)
        run: |
          cd nsck/rust_snn
          maturin develop --release
          cd ../..

      - name: Verify Rust backends
        working-directory: nsck
        run: |
          NSCK_USE_RUST=1 python scripts/verify_rust.py

      - name: Run full test suite (Rust enabled)
        working-directory: nsck
        env:
          NSCK_USE_RUST: "1"
        run: |
          python -m pytest tests/ -q --tb=short

      - name: Run V4 integration tests
        working-directory: nsck
        env:
          NSCK_USE_RUST: "1"
        run: |
          python -m pytest tests/integration/test_v4_full_system.py -v --tb=short || true

      - name: Run benchmarks (non-blocking)
        working-directory: nsck
        env:
          NSCK_USE_RUST: "1"
        run: |
          python eval/bench_spread_activation.py || true
          python eval/vsa_capability_benchmark.py || true

      - name: Run research paper benchmarks (non-blocking)
        env:
          NSCK_USE_RUST: "1"
        run: |
          python research/experiments/paper6_active_inference_benchmarks.py || true
          python research/experiments/paper7_memory_benchmarks.py || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: core-test-results-py${{ matrix.python-version }}
          path: test-results/

  test-ai-model:
    name: Test AI Model
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AI Model Tests
        run: |
          python -m pytest nsck_ai_model/tests/ -v --tb=short

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: ai-model-test-results-py${{ matrix.python-version }}
          path: test-results/

  test-image-gen:
    name: Test Image Generation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Image Generation Tests
        run: |
          python -m pytest nsck_image_gen_project/tests/ -v --tb=short

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: image-gen-test-results-py${{ matrix.python-version }}
          path: test-results/

  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    needs: [test-core, test-ai-model, test-image-gen]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-benchmark

      - name: Run Performance Benchmarks
        run: |
          python -m pytest nsck-demo/tests/ --benchmark-only \
            --benchmark-json=benchmark-results.json

      - name: Upload benchmark results
        uses: actions/upload-artifact@v3
        with:
          name: benchmark-results
          path: benchmark-results.json

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test-core, test-ai-model, test-image-gen]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Integration Tests
        run: |
          python -m pytest test_*.py -v --tb=short

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: integration-test-results
          path: test-results/

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [test-core, test-ai-model, test-image-gen, benchmark, integration]
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v3

      - name: Display test summary
        run: |
          echo "## NSCK V4 CI Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "✅ All test suites completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- NSCK Core Tests (Rust enabled): Completed" >> $GITHUB_STEP_SUMMARY
          echo "- AI Model Tests: Completed" >> $GITHUB_STEP_SUMMARY
          echo "- Image Generation Tests: Completed" >> $GITHUB_STEP_SUMMARY
          echo "- Performance Benchmarks: Completed" >> $GITHUB_STEP_SUMMARY
          echo "- Integration Tests: Completed" >> $GITHUB_STEP_SUMMARY
