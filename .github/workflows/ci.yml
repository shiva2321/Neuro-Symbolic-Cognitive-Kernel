# NSCK Core CI Pipeline
# Validates the NSCK Python + Rust core on every push and pull-request
name: NSCK CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  test-core:
    name: Test NSCK Core
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('nsck/requirements-core.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r nsck/requirements-core.txt
          pip install "maturin>=1.4"

      - name: Remove repo .venv to avoid maturin interpreter conflict
        run: rm -rf .venv

      - name: Build hypervec_rs (VSA Rust backend)
        run: |
          cd nsck/rust_vsa
          maturin develop --release

      - name: Build snn_rs (SNN Rust backend)
        run: |
          cd nsck/rust_snn
          maturin develop --release

      - name: Verify Rust backends
        working-directory: nsck
        run: |
          python scripts/verify_rust.py || true

      - name: Run full test suite (Rust enabled)
        working-directory: nsck
        env:
          NSCK_USE_RUST: "1"
        run: |
          python -m pytest tests/ -q --tb=short

      - name: Run V4 integration tests
        working-directory: nsck
        env:
          NSCK_USE_RUST: "1"
        run: |
          python -m pytest tests/integration/test_v4_full_system.py -v --tb=short || true

      - name: Run benchmarks (non-blocking)
        working-directory: nsck
        env:
          NSCK_USE_RUST: "1"
        run: |
          python eval/bench_spread_activation.py || true
          python eval/vsa_capability_benchmark.py || true

      - name: Run research paper benchmarks (non-blocking)
        env:
          NSCK_USE_RUST: "1"
        run: |
          python research/experiments/paper6_active_inference_benchmarks.py || true
          python research/experiments/paper7_memory_benchmarks.py || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-results-py${{ matrix.python-version }}
          path: test-results/
