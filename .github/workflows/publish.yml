# Publish nsck-demo on every v* tag:
#   1. build   — builds wheel + sdist from nsck/pyproject.toml
#   2. github-release — creates a GitHub Release and attaches the dist assets
#   3. pypi-publish   — publishes to PyPI via Trusted Publishing (OIDC)
#
# PyPI setup (one-time):
#   https://pypi.org/manage/project/nsck-demo/settings/publishing/
#   → Add a "pending publisher": owner=shiva2321, repo=Neuro-Symbolic-Cognitive-Kernel,
#     workflow=publish.yml, environment=pypi
name: Publish to PyPI and GitHub

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # ── 1. Build wheel + sdist ────────────────────────────────────────────────
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tool
        run: python -m pip install --upgrade pip build

      - name: Build wheel and sdist
        working-directory: nsck
        run: python -m build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: nsck/dist/

  # ── 2. GitHub Release ─────────────────────────────────────────────────────
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write   # needed to create releases and upload assets

    steps:
      - uses: actions/checkout@v4

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  # ── 3. PyPI publish (Trusted Publishing / OIDC) ───────────────────────────
  pypi-publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment: pypi
    permissions:
      id-token: write   # required for Trusted Publishing

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
