<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>NCGN v2.0 - Brain-First Architecture</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.19.0/cytoscape.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1d;
            color: #c5c6c7;
            overflow: hidden;
        }

        #container {
            display: flex;
            height: 100vh;
        }

        /* Sidebar (Chat & Controls) */
        #sidebar {
            width: 400px;
            background: #1f1f22;
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }

        h2 {
            color: #66fcf1;
            margin-top: 0;
        }

        h3 {
            color: #45a29e;
            font-size: 14px;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #chat-history {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 15px;
            border: 1px solid #333;
            padding: 10px;
            background: #0b0c10;
            border-radius: 5px;
        }

        .msg {
            margin-bottom: 8px;
            padding: 8px;
            border-radius: 6px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .msg.user {
            background: #1f2833;
            color: #fff;
            text-align: right;
            border-left: 20px solid transparent;
        }

        .msg.brain {
            background: #1c2b2d;
            color: #66fcf1;
            text-align: left;
            border-right: 20px solid transparent;
        }

        .msg.warning {
            background: #3d2c29;
            color: #ffadad;
            border: 1px solid #7a3b3b;
        }

        #input-area {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px;
            background: #0b0c10;
            border: 1px solid #45a29e;
            color: white;
            border-radius: 4px;
            outline: none;
        }

        button {
            padding: 10px 20px;
            background: #45a29e;
            color: #0b0c10;
            border: none;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s;
        }

        button:hover {
            background: #66fcf1;
        }

        /* Main Graph Area */
        #graph-area {
            flex: 1;
            position: relative;
            background: #0b0c10;
        }

        #cy {
            width: 100%;
            height: 100%;
        }

        .overlay-stats {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(31, 31, 34, 0.9);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #333;
            pointer-events: none;
        }

        .stat-item {
            margin-bottom: 5px;
            font-family: monospace;
            font-size: 12px;
        }

        .stat-val {
            color: #66fcf1;
            font-weight: bold;
        }

        /* Game Panel */
        #game-panel button {
            font-size: 12px;
            padding: 5px 10px;
        }

        #controls-panel button {
            font-size: 12px;
            padding: 5px 10px;
        }
    </style>
</head>

<body>

    <div id="container">
        <div id="sidebar">
            <h2>NCGN v2.0</h2>
            <div class="stat-item">Tick: <span id="tick-count" class="stat-val">0</span></div>
            <div class="stat-item">Nodes: <span id="node-count" class="stat-val">0</span> | Edges: <span id="edge-count"
                    class="stat-val">0</span></div>
            <hr style="border-color: #333; width: 100%;">

            <!-- File Upload & Controls -->
            <div id="controls-panel" style="margin-bottom: 20px; padding: 10px; background: #222; border-radius: 8px;">
                <h3>Knowledge Feed</h3>
                <div style="display: flex; gap: 5px; margin-bottom: 10px;">
                    <input type="file" id="file-input" style="display: none;" onchange="handleFileUpload(this)">
                    <button onclick="document.getElementById('file-input').click()">Upload File</button>
                    <button onclick="resetBrain()" style="background: #ff4757; color: white;">Reset Brain</button>
                </div>
                <div id="upload-status" style="font-size: 12px; color: #888;"></div>
            </div>

            <div id="chat-history"></div>

            <div id="game-panel" style="margin-bottom: 20px; padding: 10px; background: #222; border-radius: 8px;">
                <h3>Game Interface</h3>
                <div style="display: flex; gap: 5px; margin-bottom: 10px;">
                    <button onclick="startGame('corridor')">Corridor</button>
                    <button onclick="startGame('snake')">Snake</button>
                </div>
                <pre id="game-render"
                    style="font-family: monospace; background: #000; padding: 5px; min-height: 100px; color: #5cdb95; font-size: 10px; overflow: auto;">(No game active)</pre>
                <div style="margin-top: 5px; display: flex; gap: 5px;">
                    <button onclick="stepGame()">Step</button>
                    <button onclick="runEpisode()">Run Episode</button>
                </div>
                <div id="game-stats" style="font-size: 12px; margin-top: 5px; color: #aaa;"></div>
            </div>

            <div id="input-area">
                <input type="text" id="user-input" placeholder="Teach me or ask me..." autofocus autocomplete="off">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>

        <div id="graph-area">
            <div id="cy"></div>
            <div class="overlay-stats">
                <h3>Live Activity</h3>
                <pre id="stats-debug" style="color: #888; margin: 0;"></pre>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let cy = cytoscape({
            container: document.getElementById('cy'),
            style: [
                { selector: 'node', style: { 'background-color': '#444', 'label': 'data(id)', 'color': '#ccc', 'font-size': '10px', 'text-valign': 'center', 'text-halign': 'center' } },
                { selector: 'node.active', style: { 'background-color': '#5cdb95', 'color': '#000', 'width': 40, 'height': 40, 'font-weight': 'bold' } },
                { selector: 'edge.active', style: { 'width': 4, 'line-color': '#66fcf1', 'target-arrow-color': '#66fcf1', 'transition-property': 'width, line-color', 'transition-duration': '0.3s' } }
            ],
            layout: { name: 'cose', animate: true, animationDuration: 500 }
        });

        // === Interaction ===
        cy.on('tap', 'node', async function (evt) {
            var node = evt.target;
            console.log('Clicked ' + node.id());
            node.addClass('active'); // Immediate visual feedback

            // Inject energy on click
            try {
                const res = await fetch('/api/brain/inject', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ label: node.id(), energy: 1.0 })
                });
                const data = await res.json();
                if (data.success) {
                    addMessage(`Activated concept: ${node.id()}`, 'brain');
                    // Refresh state to see propagation
                    socket.emit('request_state');
                }
            } catch (e) { console.error(e); }
        });

        // === File Upload ===
        async function handleFileUpload(input) {
            if (!input.files || !input.files[0]) return;
            const file = input.files[0];

            const reader = new FileReader();
            reader.onload = async (e) => {
                const content = e.target.result;
                document.getElementById('upload-status').innerText = `Uploading ${file.name}...`;

                try {
                    const res = await fetch('/api/file/upload', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            filename: file.name,
                            content: content
                        })
                    });
                    const data = await res.json();

                    if (data.success) {
                        document.getElementById('upload-status').innerText =
                            `Learned from ${file.name}`;
                        addMessage(`I read ${file.name} and processed it.`, 'brain');
                    } else {
                        document.getElementById('upload-status').innerText = `Error: ${data.error}`;
                    }
                } catch (err) {
                    console.error(err);
                    document.getElementById('upload-status').innerText = "Upload failed.";
                }
            };
            reader.readAsText(file);
        }

        async function resetBrain() {
            if (!confirm("Are you sure you want to wipe the brain?")) return;
            await fetch('/api/brain/clear', { method: 'POST' });
            cy.elements().remove();
            addMessage("Brain memory wiped.", 'warning');
        }

        // === Game Logic ===
        async function startGame(type) {
            try {
                const res = await fetch('/api/game/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ game: type })
                });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('game-render').innerText = data.render;
                    addMessage(`Started ${type} game.`, 'brain');
                } else {
                    addMessage(`Failed to start game: ${data.error}`, 'warning');
                }
            } catch (e) { console.error(e); }
        }

        async function stepGame() {
            try {
                const res = await fetch('/api/game/step', { method: 'POST' });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('game-render').innerText = data.render;
                    document.getElementById('game-stats').innerText = `Reward: ${data.reward} | Done: ${data.done}`;
                } else {
                    addMessage(`Game Step Error: ${data.error || 'Unknown'}`, 'warning');
                }
            } catch (e) { console.error(e); }
        }

        async function runEpisode() {
            try {
                addMessage("Running episode...", 'brain');
                const res = await fetch('/api/game/episode', { method: 'POST' });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('game-render').innerText = data.render;
                    document.getElementById('game-stats').innerText = `Total Reward: ${data.total_reward} | Steps: ${data.steps}`;
                    addMessage(`Episode finished. Total Reward: ${data.total_reward}`, 'brain');
                } else {
                    addMessage(`Episode Error: ${data.error || 'Unknown'}`, 'warning');
                }
            } catch (e) { console.error(e); }
        }

        // === Brain State Handling ===
        // === Brain State Handling ===
        socket.on('brain_state', (data) => {
            document.getElementById('tick-count').innerText = data.tick || 0;

            // Debug stats
            document.getElementById('stats-debug').innerText =
                `Energy: ${data.total_energy?.toFixed(2)}\nFiring: ${data.active ? Object.keys(data.active).length : 0}`;

            let needsLayout = false;

            if (data.nodes) {
                document.getElementById('node-count').innerText = data.nodes.length;

                // Batch add nodes
                const newNodes = [];
                data.nodes.forEach(n => {
                    let el = cy.getElementById(n.label);
                    if (el.empty()) {
                        // Spawn at random positions to avoid stacking
                        newNodes.push({
                            group: 'nodes',
                            data: { id: n.label },
                            position: { x: Math.random() * 500, y: Math.random() * 500 }
                        });
                        needsLayout = true;
                    } else {
                        // Update activation style existing
                        if (n.energy > 0.1) el.addClass('active');
                        else el.removeClass('active');
                    }
                });
                if (newNodes.length > 0) cy.add(newNodes);
            }

            if (data.edges) {
                document.getElementById('edge-count').innerText = data.edges.length;
                const newEdges = [];
                data.edges.forEach(e => {
                    const eid = `${e.source}_${e.target}`;
                    let el = cy.getElementById(eid);

                    if (el.empty()) {
                        newEdges.push({
                            group: 'edges', data: { id: eid, source: e.source, target: e.target }
                        });
                        needsLayout = true;
                    }
                });
                if (newEdges.length > 0) cy.add(newEdges);
            }

            // Force layout if we added things
            if (needsLayout) {
                const layout = cy.layout({
                    name: 'cose',
                    animate: true,
                    animationDuration: 800,
                    fit: true,
                    padding: 50,
                    nodeRepulsion: 4500
                });
                layout.run();
            }
        });

        // === Chat Logic ===
        async function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value;
            if (!text) return;

            addMessage(text, 'user');
            input.value = '';

            try {
                const res = await fetch('/api/brain/process', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ input: text })
                });
                const data = await res.json();

                if (data.formatted_response) {
                    addMessage(data.formatted_response, 'brain');
                } else if (data.graph_updates && data.graph_updates.rejected.length > 0) {
                    addMessage("I rejected those updates due to conflict.", 'warning');
                } else {
                    addMessage("Processed. (Internal state updated)", 'brain');
                }

                // Check for conflicts
                const conflicts = data.graph_updates?.conflicts || [];
                if (conflicts.length > 0) {
                    addMessage(`CONFLICT: ${conflicts[0].message}`, 'warning');
                }

            } catch (e) {
                addMessage("Error communicating with brain.", 'warning');
            }
        }

        function addMessage(text, type) {
            const history = document.getElementById('chat-history');
            const div = document.createElement('div');
            div.className = `msg ${type}`;
            div.innerText = text;
            history.appendChild(div);
            history.scrollTop = history.scrollHeight;
        }

        document.getElementById('user-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Start auto-pull
        setInterval(() => {
            socket.emit('request_state');
        }, 1000); // 1fps polling
    </script>
</body>

</html>
