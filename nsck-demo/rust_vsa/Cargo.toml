[package]
name = "rust_vsa"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "hypervec_py"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.20", features = ["extension-module"] }
rand = "0.8"
rand_chacha = "0.3"
bitvec = "1.0"
serde = { version = "1.0", features = ["derive"] }
