<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSCK - Task Monitor</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background: #050505;
        }

        .grid-container {
            grid-template-columns: 1fr 400px;
            grid-template-rows: 50px 1fr;
        }

        .header {
            grid-column: 1 / span 2;
        }

        .sidebar-left {
            display: none;
        }

        .main-view {
            padding: 10px;
        }

        .visual-cortex {
            height: 600px;
        }

        #canvas-task {
            width: 100%;
            height: auto;
            max-width: 500px;
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>

<body class="theme-dark">
    <div class="grid-container">
        <!-- HEADER -->
        <header class="header">
            <div class="logo">NSCK <span class="neon-text">TASK MONITOR</span></div>
            <div class="task-info">
                <span id="task-name" class="neon-blue">...</span> |
                <span id="conn-status">CONNECTING</span> |
                TEACHER: <span id="teacher-status" style="color: #888;">...</span>
            </div>
        </header>

        <!-- MAIN MONITOR -->
        <main class="main-view">
            <section class="panel visual-cortex">
                <div class="panel-header task-header">
                    <h2><i class="icon">👁</i> PERCEPTION & BRAIN</h2>
                    <div class="header-actions">
                        <button class="btn btn-game" style="background: #0aff00; color: #000;"
                            onclick="startGame()">START</button>
                        <button class="btn btn-game" style="background: #ffaa00; color: #000;"
                            onclick="stopGame()">STOP</button>

                    </div>
                </div>
                <!-- DUAL VIEW CONTAINER -->
                <div class="dual-view-container"
                    style="display:flex; justify-content:space-around; align-items:flex-start; background:#000; padding:10px;">
                    <div class="view-block">
                        <h4 style="text-align:center; color:#00f3ff; margin:5px;">REALITY (GAME)</h4>
                        <canvas id="canvas-game" width="300" height="300" style="border: 2px solid #333;"></canvas>
                    </div>
                    <div class="view-block">
                        <h4 style="text-align:center; color:#bc13fe; margin:5px;">CORTEX (INPUT)</h4>
                        <canvas id="canvas-task" width="300" height="300"
                            style="border: 2px solid #333; image-rendering: pixelated;"></canvas>
                    </div>
                </div>

                <div class="visual-metrics">
                    <div class="metric">CONFIDENCE: <span id="conf-val">0.0%</span></div>
                    <div class="metric">ENTROPY: <span id="entropy-val">0.0</span></div>
                </div>
            </section>

            <section class="panel telemetry-deck" style="height: 300px;">
                <h2><i class="icon">📈</i> PERFORMANCE OVERVIEW</h2>
                <div class="chart-wrapper">
                    <canvas id="taskChart"></canvas>
                </div>
            </section>
        </main>

        <!-- SIDEBAR: REASONING & LOGS -->
        <aside class="sidebar-right">
            <section class="panel reasoning-portal">
                <h2><i class="icon">🔍</i> COGNITIVE RATIONALE</h2>
                <div id="reasoning-content" class="scroll-view monospaced">
                    <div class="empty-msg">Waiting for agent thoughts...</div>
                </div>
            </section>

            <section class="panel comms-deck">
                <div class="panel-header" style="display:flex; justify-content:space-between; align-items:center;">
                    <h2><i class="icon">📜</i> TASK LOGS</h2>
                    <button class="btn btn-small" onclick="exportTaskLog()">💾 EXPORT</button>
                </div>
                <div id="log-stream" class="scroll-view monospaced" style="height: 100%;"></div>
            </section>
        </aside>
    </div>

    <script src="/js/task_app.js"></script>
</body>

</html>
